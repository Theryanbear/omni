[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-mail"
version = "0.1.0"
description = "Self-hosted cold email campaigns that Claude can run over MCP"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
omni-mail = "omni_mail.cli:main"

[tool.setuptools]
packages = ["omni_mail"]
